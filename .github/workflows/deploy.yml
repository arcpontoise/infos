---
name: Build et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      charte_ref:
        description: Commit ou branche de la charte utilisé pour générer les PDF
        required: false
        default: main
        type: string

permissions:
  contents: read

# A new push to a pull request cancels its previous run; main runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check of the main branch ruleset
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Lint YAML
        run: yamllint .
      - name: Lint Python
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Validation des données
        run: python scripts/build.py --check

  # Also run on pull requests so a broken page or PDF never reaches main
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dépendances système (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Charte graphique pour les PDF
        uses: actions/checkout@v7
        with:
          repository: arcpontoise/charte
          ref: ${{ inputs.charte_ref || 'main' }}
          path: _charte
          persist-credentials: false
      - name: Génération
        env:
          CHARTE_LOCAL: ${{ github.workspace }}/_charte
        run: |
          echo "Charte utilisée pour les PDF : $(git -C "$CHARTE_LOCAL" rev-parse --short HEAD)"
          python scripts/build.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never interrupt a deployment in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
